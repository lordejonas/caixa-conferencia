<header class="header-principal-novo shadow-sm">
  <div class="header-container-center container">
    <div class="top-nav">
      <a [routerLink]="['/']" class="btn-voltar">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>

</header>

<main class="config-content container">

    <!-- Opção 1: Conectar Nuvem -->

    <!-- Futuras opções podem ser adicionadas aqui no mesmo formato -->

<footer class="footer-novo">

    <p class="footer-texto">Conferência Santa Perpétua e Santa Felicidade - DF</p>
    <span class="version-tag-blue">v2.0.0-Beta</span>
