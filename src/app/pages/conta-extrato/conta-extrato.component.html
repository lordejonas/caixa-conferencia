<app-internal-layout [titulo]="conta?.titulo || 'Extrato da Conta'" [exibirFooterPadrao]="false">
  <div class="extrato-container">
    <app-lista-lancamentos
      [lancamentos]="lancamentosExtrato"
      [carregando]="carregando"
      mensagemVazia="Nenhum lançamento encontrado para esta conta."
      [exibirBotaoSaldoAbertura]="true"
      (aoClicarSaldoAbertura)="irParaSaldoAbertura()">
    </app-lista-lancamentos>
  </div>

  <!-- PAINEL FIXO NO RODAPÉ -->
  <div class="rodape-fixo" (click)="$event.stopPropagation()">
    <div class="container d-flex align-items-center justify-content-end gap-2">

      <!-- Botão de Transferência -->
      <a routerLink="/lancamentos/transferencia" class="btn-transferencia" aria-label="Nova transferência">
        <span>⇄</span>
      </a>

      <!-- Botão de Novo Lançamento -->
      <a routerLink="/lancamentos/novo" class="btn-adicionar" aria-label="Adicionar lançamento">
        <span>+</span>
      </a>

    </div>
  </div>
</app-internal-layout>
