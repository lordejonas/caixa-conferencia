<app-internal-layout [titulo]="conta?.titulo || 'Extrato da Conta'" [exibirFooterPadrao]="false">
  <div class="extrato-container">
    <app-lista-lancamentos
      [lancamentos]="lancamentosExtrato"
      [carregando]="carregando"
      mensagemVazia="Nenhum lançamento encontrado para esta conta."
      [exibirBotaoSaldoAbertura]="true"
      (aoClicarSaldoAbertura)="irParaSaldoAbertura()"
      (aoExcluir)="excluirLancamento($event)"
      (aoAlterar)="alterarLancamento($event)">
    </app-lista-lancamentos>
  </div>

  <!-- PAINEL FIXO NO RODAPÉ -->
  <div class="rodape-fixo" (click)="$event.stopPropagation()">
    <div class="container d-flex align-items-center justify-content-between">

      <!-- Saldo da Conta (Alinhado à Esquerda) -->
      <div class="info-saldo d-flex flex-column" *ngIf="conta">

        <span class="valor-saldo" [ngClass]="obterClasseSaldo(conta.saldo_atual)">
          {{ (conta.saldo_atual || 0) | moedaCentavos }}
        </span>
      </div>

      <!-- Botões de Ação (Alinhados à Direita) -->
      <div class="d-flex align-items-center gap-2">
        <!-- Botão de Transferência -->
        <a
          [routerLink]="['/lancamentos/transferencia']"
          [queryParams]="{ contaId: conta?.id }"
          class="btn-transferencia"
          aria-label="Nova transferência">
          <span>⇄</span>
        </a>

        <!-- Botão de Novo Lançamento -->
        <a
          [routerLink]="['/lancamentos/novo']"
          [queryParams]="{ contaId: conta?.id }"
          class="btn-adicionar"
          aria-label="Adicionar lançamento">
          <span>+</span>
        </a>
      </div>

    </div>
  </div>
</app-internal-layout>
