<app-internal-layout titulo="Configurações" subTitulo="Entidades">

  <div class="lista-configuracoes">

    <!-- Item 1: Favorecidos -->
    <a [routerLink]="['/favorecidos']" class="item-config">
      <div class="item-info">
        <span class="item-icone">👤</span>
        <span class="item-titulo">Favorecidos</span>
      </div>
      <span class="item-seta">&rsaquo;</span>
    </a>

    <!-- Item 2: Categorias (Adicionado no padrão) -->
    <a [routerLink]="['/categorias']" class="item-config">
      <div class="item-info">
        <span class="item-icone">🏷️</span>
        <span class="item-titulo">Categorias</span>
      </div>
      <span class="item-seta">&rsaquo;</span>
    </a>

    <!-- Opção 3: Entidades -->
    <a [routerLink]="['/contas']" class="item-config">
      <div class="item-info">
        <span class="item-icone">🏦</span>
        <span class="item-titulo">Contas</span>
      </div>
      <span class="item-seta">&rsaquo;</span>
    </a>

    <!-- Futuras entidades (Categorias, Contas, etc.) entrarão aqui no mesmo padrão -->

  </div>

</app-internal-layout>
