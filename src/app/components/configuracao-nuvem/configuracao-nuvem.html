<header class="header-principal shadow-sm mb-4">
  <div class="header-container-flex container">
    <a [routerLink]="['/']" class="text-white text-decoration-none me-2">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
    </a>
    <h1 class="h5 mb-0 fw-bold">Conectar Nuvem (Firebase)</h1>
  </div>
</header>

<main class="container pb-5">
  <div class="card shadow-sm p-4 mb-4">
    <!-- Status de Conexão -->
    <div *ngIf="estaConectado" class="alert alert-success mb-4">
      <strong>Status: Conectado!</strong> Perfil ativo:
      <span class="badge bg-primary text-uppercase">{{ config.perfil }}</span>
    </div>

    <form (ngSubmit)="salvarEConectar()">
      <!-- Campos do Firebase (API Key, Project ID, etc.) -->
      <div class="mb-3">
        <label class="form-label small fw-bold">API Key</label>
        <input type="text" class="form-control" [(ngModel)]="config.apiKey" name="apiKey" required>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-bold">Project ID</label>
        <input type="text" class="form-control" [(ngModel)]="config.projectId" name="projectId" required>
      </div>

      <div class="mb-3">
        <label class="form-label small fw-bold">App ID</label>
        <input type="text" class="form-control" [(ngModel)]="config.appId" name="appId">
      </div>

      <!-- SELEÇÃO DE PERFIL (COMBOBOX) -->
      <div class="mb-3 p-3 border rounded bg-light">
        <label class="form-label fw-bold text-primary">Perfil de Acesso</label>
        <select class="form-select" [(ngModel)]="perfilSelecionado" (change)="aoMudarPerfil()" name="perfil">
          <option value="membro">Membro (Apenas Leitura)</option>
          <option value="tesoureiro">Tesoureiro (Leitura e Escrita)</option>
        </select>
        <small class="text-muted d-block mt-1">
          * Membros acompanham os dados sem alterar a nuvem. Tesoureiros podem criar e editar lançamentos.
        </small>
      </div>

      <!-- CAMPO DE SENHA (Apenas se selecionar Tesoureiro) -->
      <div *ngIf="perfilSelecionado === 'tesoureiro'" class="mb-3">
        <label class="form-label small fw-bold text-danger">Senha da Tesouraria</label>
        <input type="password" class="form-control border-danger" [(ngModel)]="senhaDigitada" name="senha" placeholder="Digite a senha para habilitar o modo Tesoureiro" required>
      </div>

      <p *ngIf="mensagemStatus" class="small text-danger fw-bold mt-2">{{ mensagemStatus }}</p>

      <div class="d-grid gap-2 mt-4">
        <button type="submit" class="btn btn-primary fw-bold">
          Salvar e Conectar
        </button>

        <button *ngIf="estaConectado" type="button" (click)="desconectar()" class="btn btn-outline-danger btn-sm">
          Desconectar
        </button>
      </div>
    </form>
  </div>
</main>
